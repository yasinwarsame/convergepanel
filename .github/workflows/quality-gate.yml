name: ConvergePanel Quality Gate

# Vercel's own status checks only prove the app builds well enough to deploy
# — they don't run typecheck, lint, or the Jest suite. This workflow closes
# that gap so a PR can't merge on a green Vercel build alone while shipping
# a type error, a lint regression, or a broken test. Every command here was
# verified locally to run cleanly with zero environment variables/secrets
# (lib/env.ts only warns on missing API keys, never throws; `prisma
# generate` doesn't need DATABASE_URL; every test file that touches
# Firebase/Firestore mocks @/lib/firebase/admin at the module level — see
# the PR description for the full audit), so nothing here needs production
# credentials.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run when a PR gets new commits, so we're never paying
# for or blocking on stale runs.
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The required check. It keeps every static step (type check, lint, the real
  # build, the build boundary gate, the falsifiability pre-flight) and waits for
  # the Jest shards below. Its last step FAILS unless every shard passed AND
  # the shards together ran exactly the full suite inventory, each suite once.
  quality:
    name: Quality Gate
    needs: jest
    # `!cancelled()`, not the default `success()`: when a shard fails this job
    # must still RUN and fail. A required check that is skipped is reported as
    # passing by branch protection. A cancelled run stays cancelled (not green).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Depth 2: on a pull_request the checkout is the merge commit, and its
          # second parent must be verified to be the exact PR head (build boundary).
          fetch-depth: 2

      - name: Verify the build is of the exact PR head
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" || { echo "merge commit's PR parent $(git rev-parse HEAD^2) != PR head $PR_HEAD_SHA"; exit 1; }
          echo "Building merge $(git rev-parse HEAD) of PR head $PR_HEAD_SHA into $(git rev-parse HEAD^1)"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches package.json's "engines.node": "24.x".
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        # The real production build. lib/security/buildBoundary.js runs inside
        # every webpack compiler and FAILS this step if deployed code resolves
        # the SYSTEM_ADMIN claim tool (PR #295 build boundary, Layer A).
        env:
          CP_BUILD_BOUNDARY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run build

      - name: Build boundary gate
        # Layer B: independent check of THIS build's artifacts (plugin manifests
        # stamped with this run's nonce, Next file traces, emitted chunks).
        # Fails closed on missing, stale or incomplete evidence: a skipped or
        # failed build can never pass. Do not make this step conditional.
        env:
          CP_BUILD_BOUNDARY_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/security/check-build-boundary.js --dist .next

      - name: Security-test falsifiability pre-flight
        # Phase FIRST-ADMIN-C7: the scanner existed since C6 but ran only when
        # someone remembered to invoke it, so it never gated a PR. It is a LINT,
        # not a proof — it flags known-vacuous assertion shapes and cannot
        # establish semantic falsifiability. Human/mutation review stays required.
        # --all, NOT the default changed-files mode: `actions/checkout` does a
        # shallow single-commit fetch, so `origin/main` does not resolve here and
        # a change-scoped scan would examine nothing and call it clean.
        run: |
          # The scanner's own positive anchor first: prove each shape still
          # detects the historical defect it was written for. A scan that
          # reports "clean" with dead regexes is worse than no scan.
          npm run security:preflight -- --self-test
          npm run security:preflight -- --all

      - name: Download Jest shard results
        uses: actions/download-artifact@v4
        with:
          pattern: jest-shard-*
          path: jest-shards

      - name: Test
        # Aggregate gate over the shards. Fails closed on: any shard not
        # successful, a missing or unreadable shard result, any failed or
        # errored suite, a suite run twice, a suite of the full `--listTests`
        # inventory that no shard ran, a suite outside it, or a shard whose
        # executed set differs from its deterministic `--shard` plan.
        env:
          JEST_SHARDS_RESULT: ${{ needs.jest.result }}
        run: node scripts/ci/check-jest-shards.js --total 3 --dir jest-shards --needs-result "$JEST_SHARDS_RESULT"

  # The full Jest suite in deterministic shards (`jest --shard`), run in
  # parallel. One unsharded run reached the 30-minute job limit on slower
  # runners; splitting it keeps each job well inside the same limit without
  # raising it. Every shard runs the same test files, config and flags as the
  # former single unsharded Jest step; only the partition differs.
  jest:
    name: Jest shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Let every shard finish, so one failure does not hide another.
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify the tests are of the exact PR head
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" || { echo "merge commit's PR parent $(git rev-parse HEAD^2) != PR head $PR_HEAD_SHA"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare build-generated test inputs
        # The unsharded suite ran after `npm run build`. These are the two
        # build pre-steps whose outputs a test can observe (the materialized
        # pdf.js worker and the generated Prisma client). `next build` itself
        # is not needed: no suite reads the build output (.next).
        run: |
          node scripts/pdfjs-worker/materialize.js
          npx prisma generate

      - name: Test (shard ${{ matrix.shard }}/3)
        run: npx jest --runInBand --shard=${{ matrix.shard }}/3 --json --outputFile=jest-shard-${{ matrix.shard }}.json

      - name: Upload shard result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jest-shard-${{ matrix.shard }}
          path: jest-shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7
