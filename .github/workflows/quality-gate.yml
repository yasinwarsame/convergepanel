name: ConvergePanel Quality Gate

# Vercel's own status checks only prove the app builds well enough to deploy
# — they don't run typecheck, lint, or the Jest suite. This workflow closes
# that gap so a PR can't merge on a green Vercel build alone while shipping
# a type error, a lint regression, or a broken test. Every command here was
# verified locally to run cleanly with zero environment variables/secrets
# (lib/env.ts only warns on missing API keys, never throws; `prisma
# generate` doesn't need DATABASE_URL; every test file that touches
# Firebase/Firestore mocks @/lib/firebase/admin at the module level — see
# the PR description for the full audit), so nothing here needs production
# credentials.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel a superseded run when a PR gets new commits, so we're never paying
# for or blocking on stale runs.
concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches package.json's "engines.node": "24.x".
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Security-test falsifiability pre-flight
        # Phase FIRST-ADMIN-C7: the scanner existed since C6 but ran only when
        # someone remembered to invoke it, so it never gated a PR. It is a LINT,
        # not a proof — it flags known-vacuous assertion shapes and cannot
        # establish semantic falsifiability. Human/mutation review stays required.
        # --all, NOT the default changed-files mode: `actions/checkout` does a
        # shallow single-commit fetch, so `origin/main` does not resolve here and
        # a change-scoped scan would examine nothing and call it clean.
        run: |
          # The scanner's own positive anchor first: prove each shape still
          # detects the historical defect it was written for. A scan that
          # reports "clean" with dead regexes is worse than no scan.
          npm run security:preflight -- --self-test
          npm run security:preflight -- --all

      - name: Test
        run: npx jest --runInBand
